name: generate snake

on:
  # Har 24 soatda avtomatik yangilanishi uchun (soat 00:00 da)
  schedule:
    - cron: "0 0 * * *"
  
  # O'zingiz xohlagan payt qo'lda ishga tushirishingiz uchun tugma (Run workflow)
  workflow_dispatch:
  
  # main branchga har safar o'zgarish (push) bo'lganda ham yangilanishi uchun
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # azoffuz foydalanuvchisi uchun iloncha animatsiyasini (SVG) yaratish
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Yaratilgan SVG fayllarni "output" nomli alohida branchga yuklash
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
